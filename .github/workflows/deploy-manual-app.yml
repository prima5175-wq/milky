# 오픈 매뉴얼 앱을 빌드해서 docs/manual/ 에 커밋합니다.
#
# ⚠️ 이 저장소의 GitHub Pages 는 "Deploy from a branch" (main / docs 폴더) 로
#    설정되어 있습니다. 그래서 docs/ 안에 있는 파일이 그대로 서비스됩니다.
#      https://prima5175-wq.github.io/milky/              → docs/index.html      (하원 현황)
#      https://prima5175-wq.github.io/milky/checkin.html  → docs/checkin.html    (출석 체크인)
#      https://prima5175-wq.github.io/milky/manual/       → docs/manual/         (오픈 매뉴얼 앱)
#
#    지점 태블릿이 앞의 두 주소를 실제로 쓰고 있으므로 docs/index.html 과
#    docs/checkin.html 은 절대 건드리지 않습니다. 이 워크플로는 docs/manual/
#    안에만 씁니다.
#
#    Pages 설정을 바꿀 필요가 없도록 일부러 이 방식을 씁니다.
name: Build manual app into docs/

on:
  push:
    branches: [main]
    paths:
      # docs/ 는 트리거에서 제외합니다. 이 워크플로가 docs/ 에 커밋하므로
      # 포함하면 자기 자신을 무한히 다시 실행시킵니다.
      - 'booktree-open-manual-app/**'
      - '.github/workflows/deploy-manual-app.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-manual
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: booktree-open-manual-app/.nvmrc
          cache: npm
          cache-dependency-path: booktree-open-manual-app/package-lock.json

      - name: 앱 빌드
        working-directory: booktree-open-manual-app
        env:
          # Pages 가 /레포이름/manual/ 하위에서 서비스하므로 base 를 맞춰줍니다.
          VITE_BASE: /${{ github.event.repository.name }}/manual/
        run: |
          npm ci
          npm run build

      - name: docs/manual/ 갱신
        run: |
          rm -rf docs/manual
          mkdir -p docs/manual
          cp -r booktree-open-manual-app/dist/. docs/manual/

      - name: 지점 운영 화면이 그대로인지 확인
        run: |
          test -f docs/index.html        || { echo "❌ 하원 현황(docs/index.html) 누락"; exit 1; }
          test -f docs/checkin.html      || { echo "❌ 체크인(docs/checkin.html) 누락"; exit 1; }
          test -f docs/manual/index.html || { echo "❌ 매뉴얼 앱 누락"; exit 1; }
          git diff --quiet -- docs/index.html docs/checkin.html \
            || { echo "❌ 지점 운영 화면이 변경되었습니다. 중단합니다."; exit 1; }
          echo "✅ 세 주소 모두 정상"

      - name: 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/manual
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋하지 않습니다."
            exit 0
          fi
          git commit -m "빌드: 오픈 매뉴얼 앱 docs/manual/ 갱신 [skip ci]"
          git push
