# GitHub Pages 배포.
#
# ⚠️ 이 저장소의 Pages 는 원래 docs/ 폴더를 서비스하고 있었습니다.
#    지점 태블릿이 아래 두 주소를 실제로 쓰고 있으므로 절대 없어지면 안 됩니다.
#      https://prima5175-wq.github.io/milky/              → 하원 현황 (docs/index.html)
#      https://prima5175-wq.github.io/milky/checkin.html  → 출석 체크인 (docs/checkin.html)
#    그래서 이 워크플로는 docs/ 를 루트에 그대로 올리고,
#    오픈 매뉴얼 앱은 /manual/ 하위에 따로 올립니다.
#
#    새 파일을 추가할 때 docs/ 를 덮어쓰지 않도록 주의하세요.
name: Deploy Pages (하원현황 · 체크인 · 오픈매뉴얼)

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'booktree-open-manual-app/**'
      - '.github/workflows/deploy-manual-app.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: booktree-open-manual-app/.nvmrc
          cache: npm
          cache-dependency-path: booktree-open-manual-app/package-lock.json

      - name: 오픈 매뉴얼 앱 빌드
        working-directory: booktree-open-manual-app
        env:
          VITE_BASE: /${{ github.event.repository.name }}/manual/
        run: |
          npm ci
          npm run build

      - name: 사이트 조립 (docs = 루트, 매뉴얼 앱 = /manual/)
        run: |
          mkdir -p site
          cp -r docs/. site/                      # 하원 현황 · 체크인 (기존 주소 유지)
          mkdir -p site/manual
          cp -r booktree-open-manual-app/dist/. site/manual/
          echo "--- 배포될 파일 ---"
          find site -type f | sort

      - name: 기존 주소가 살아있는지 확인
        run: |
          test -f site/index.html   || { echo "❌ 하원 현황(index.html) 누락"; exit 1; }
          test -f site/checkin.html || { echo "❌ 체크인(checkin.html) 누락"; exit 1; }
          test -f site/manual/index.html || { echo "❌ 매뉴얼 앱 누락"; exit 1; }
          echo "✅ 세 주소 모두 정상"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
