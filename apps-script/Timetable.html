<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시간표</title>
<style>
  :root{
    --bg:#0f1117; --panel:#171a22; --panel2:#20242f; --line:#2c3140;
    --ink:#f4f5f8; --muted:#9aa1b2; --accent:#4f8cff; --danger:#ff5a5a;
    --sat:#5aa9ff; --sun:#ff6b6b;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
    background:var(--bg); color:var(--ink); display:flex; flex-direction:column;
    height:100vh; overflow:hidden; -webkit-text-size-adjust:100%;
  }
  button,input,select{font-family:inherit}
  button{cursor:pointer;border:0;border-radius:10px}

  #err{display:none;background:#3a1216;color:#ffd0d0;padding:10px 14px;
    font-size:13px;white-space:pre-wrap}

  /* ---- top bar ---- */
  header{background:var(--panel);border-bottom:1px solid var(--line);
    padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  header h1{font-size:17px;font-weight:800;letter-spacing:-.02em}
  header .save{font-size:12px;color:var(--muted);margin-left:auto}

  /* ---- filter chips ---- */
  .filters{background:var(--panel);border-bottom:1px solid var(--line);
    padding:6px 14px 10px;display:flex;flex-direction:column;gap:7px}
  .frow{display:flex;gap:6px;align-items:center;overflow-x:auto;padding-bottom:2px}
  .frow .lbl{font-size:12px;color:var(--muted);flex:0 0 auto;width:34px}
  .chip{flex:0 0 auto;background:var(--panel2);color:var(--ink);
    border:1px solid var(--line);border-radius:999px;padding:7px 14px;
    font-size:14px;font-weight:600;white-space:nowrap}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

  /* ---- grid ---- */
  #stage{flex:1;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch}
  .grid{background:#fff;color:#111;border-radius:12px;overflow:hidden;
    box-shadow:0 8px 30px rgba(0,0,0,.45);min-width:640px}
  .ghead{display:flex;border-bottom:2px solid #dcdce4}
  .gcorner{flex:0 0 46px;background:#f5f5f9}
  .dh{flex:1 1 0;min-width:0;text-align:center;padding:8px 2px;font-weight:800;
    background:#f8f8fc;border-left:1px solid #ededf3}
  .dh .c{display:block;font-size:11px;color:#9a9a9a;font-weight:600}
  .dh.sat{color:var(--sat)} .dh.sun{color:var(--sun)}
  .gbody{display:flex}
  .tcol{flex:0 0 46px;background:#f5f5f9}
  .tcell{border-top:1px solid #e6e6ee;font-size:10px;color:#888;
    text-align:right;padding:1px 5px 0 0}
  .tcell.hour{border-top:1px solid #cfcfda;color:#555}
  .dcol{flex:1 1 0;min-width:0;position:relative;border-left:1px solid #ededf3;
    background:repeating-linear-gradient(#fff,#fff calc(var(--rh) - 1px),
      #eef 0,#eef var(--rh),#fff var(--rh),#fff calc(var(--rh)*2 - 1px),
      #dfe3ef 0,#dfe3ef calc(var(--rh)*2))}
  .blk{position:absolute;border-radius:7px;color:#fff;padding:3px 2px;
    overflow:hidden;font-weight:700;line-height:1.12;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);
    display:flex;flex-direction:column;align-items:center;text-align:center}
  .blk .tt{font-size:10px;opacity:.95;white-space:nowrap}
  .blk .nm{flex:1;display:flex;align-items:center;justify-content:center;
    font-size:12px;word-break:break-all}
  .empty{color:#aaa;text-align:center;padding:40px 10px;font-size:14px}

  /* ---- bottom bar ---- */
  footer{background:var(--panel);border-top:1px solid var(--line);
    padding:10px 14px;display:flex;gap:8px;align-items:center}
  .fab{flex:1;background:var(--accent);color:#fff;font-size:16px;font-weight:800;
    padding:14px;border-radius:12px}
  .fbtn{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    padding:14px 16px;font-size:15px;font-weight:700;border-radius:12px}

  /* ---- modal ---- */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
    align-items:flex-end;justify-content:center;z-index:50}
  .ov.show{display:flex}
  .sheet{background:var(--panel);width:100%;max-width:560px;
    border-radius:18px 18px 0 0;padding:18px 16px 22px;max-height:92vh;overflow:auto}
  @media(min-width:600px){.ov{align-items:center}.sheet{border-radius:18px}}
  .sheet h2{font-size:18px;margin-bottom:14px}
  .fld{margin-bottom:14px}
  .fld label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .fld input[type=text],.fld input[type=time]{width:100%;background:#0c0e14;
    color:var(--ink);border:1px solid var(--line);border-radius:10px;
    padding:12px;font-size:16px}
  .days{display:flex;gap:5px}
  .days button{flex:1;background:var(--panel2);color:var(--ink);
    border:1px solid var(--line);border-radius:10px;padding:12px 0;font-size:15px;font-weight:700}
  .days button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .days button.on.sat{background:var(--sat);border-color:var(--sat)}
  .days button.on.sun{background:var(--sun);border-color:var(--sun)}
  .two{display:flex;gap:10px}.two>*{flex:1}
  .acts{display:flex;gap:8px;margin-top:6px}
  .acts .save{flex:1;background:var(--accent);color:#fff;padding:14px;font-size:16px;font-weight:800;border-radius:12px}
  .acts .del{background:#3a1f24;color:#ff9d9d;border:1px solid #5a2a30;padding:14px 18px;font-size:15px;font-weight:700;border-radius:12px}
  .acts .cancel{background:var(--panel2);color:var(--ink);border:1px solid var(--line);padding:14px 18px;font-size:15px;border-radius:12px}
  .row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .row2 button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);padding:12px 14px;font-size:14px;font-weight:600;border-radius:10px}
  .row2 button.danger{background:#3a1f24;color:#ff9d9d;border-color:#5a2a30}
  textarea{width:100%;min-height:140px;background:#0c0e14;color:var(--ink);
    border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;
    font-family:ui-monospace,monospace;margin-top:8px}
  .hint{font-size:12px;color:var(--muted);line-height:1.6}
  input[type=color]{width:46px;height:40px;border:1px solid var(--line);
    border-radius:8px;background:#0c0e14;padding:2px}
</style>
</head>
<body>
<div id="err"></div>

<header>
  <h1>📅 시간표</h1>
  <span class="save" id="saveState"></span>
</header>

<div class="filters">
  <div class="frow" id="fBranch"></div>
  <div class="frow" id="fTarget"></div>
</div>

<div id="stage"><div id="host"></div></div>

<footer>
  <button class="fab" id="addBtn">➕ 수업 추가</button>
  <button class="fbtn" id="imgBtn">📷</button>
  <button class="fbtn" id="setBtn">⚙</button>
</footer>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script>
"use strict";
(function(){
try{

var DAYS=["월","화","수","목","금","토","일"];
var DAY_I={}; DAYS.forEach(function(d,i){DAY_I[d]=i;});
var PALETTE=["#4f8cff","#ff7a59","#33c48d","#c46bff","#ffb020","#ff5a8a",
  "#20c9d6","#8a7bff","#7bbf3a","#ff9d3a","#3aa0ff","#e05a5a",
  "#5ad1a0","#d98cff","#f2c14e","#6c8cff","#e8746a","#48b3c9"];

var state={
  items:[],          // {id,branch,target,name,days:[..],start,end,color}
  colorMap:{},
  fBranch:"전체", fTarget:"전체",
  cfg:{start:9,end:22, colorBy:"대상"}  // 대상/지점/항목
};
var _id=1; function uid(){ return "i"+(_id++); }

function t2m(s){ if(!s)return 0; var p=String(s).split(":"); return (+p[0])*60+(+(p[1]||0)); }
function m2t(m){ m=Math.max(0,Math.round(m)); var h=Math.floor(m/60),x=m%60;
  return (h<10?"0":"")+h+":"+(x<10?"0":"")+x; }

/* ---- 색 ---- */
function ckey(it){ return state.cfg.colorBy==="지점"?(it.branch||"(빈)")
  :state.cfg.colorBy==="항목"?(it.name||"(빈)"):(it.target||"(빈)"); }
function colorOf(it){
  if(it.color) return it.color;
  var k=ckey(it);
  if(!state.colorMap[k]){ var n=Object.keys(state.colorMap).length;
    state.colorMap[k]=PALETTE[n%PALETTE.length]; }
  return state.colorMap[k];
}

/* ---- 목록 ---- */
function branches(){ var s={},o=[]; state.items.forEach(function(it){
  var b=it.branch||""; if(b&&!s[b]){s[b]=1;o.push(b);} }); return o; }
function targets(){ var s={},o=[]; itemsByBranch().forEach(function(it){
  var t=it.target||""; if(t&&!s[t]){s[t]=1;o.push(t);} }); return o; }
function itemsByBranch(){ return state.items.filter(function(it){
  return state.fBranch==="전체" || (it.branch||"")===state.fBranch; }); }
function visible(){ return itemsByBranch().filter(function(it){
  return state.fTarget==="전체" || (it.target||"")===state.fTarget; }); }

/* ---- 시간 범위 자동 ---- */
function range(){
  var vis=visible();
  if(!vis.length) return {s:state.cfg.start*60, e:state.cfg.end*60};
  var mn=1e9,mx=-1e9;
  vis.forEach(function(it){ mn=Math.min(mn,t2m(it.start)); mx=Math.max(mx,t2m(it.end)); });
  mn=Math.floor(mn/60)*60; mx=Math.ceil(mx/60)*60; if(mx-mn<60)mx=mn+60;
  return {s:mn,e:mx};
}

/* ---- 겹침 → 레인 ---- */
function lanesForDay(list){
  var order=list.map(function(x,i){return i;}).sort(function(a,b){
    return t2m(list[a].start)-t2m(list[b].start); });
  var laneEnd=[], lane=new Array(list.length);
  order.forEach(function(i){ var s=t2m(list[i].start),e=t2m(list[i].end),put=false;
    for(var L=0;L<laneEnd.length;L++){ if(s>=laneEnd[L]){lane[i]=L;laneEnd[L]=e;put=true;break;} }
    if(!put){ lane[i]=laneEnd.length; laneEnd.push(e); } });
  return {lane:lane, n:Math.max(1,laneEnd.length)};
}

/* ============ 렌더 ============ */
function el(t,a,k){ var e=document.createElement(t);
  if(a)for(var x in a){ if(x==="class")e.className=a[x]; else if(x==="html")e.innerHTML=a[x];
    else if(x.slice(0,2)==="on")e.addEventListener(x.slice(2),a[x]); else if(a[x]!=null)e.setAttribute(x,a[x]); }
  (k||[]).forEach(function(c){ if(c!=null)e.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return e; }

function renderFilters(){
  var b=document.getElementById("fBranch"); b.innerHTML="";
  b.appendChild(el("span",{class:"lbl"},["지점"]));
  var bs=["전체"].concat(branches());
  bs.forEach(function(x){ b.appendChild(el("button",{class:"chip"+(state.fBranch===x?" on":""),
    onclick:function(){ state.fBranch=x; state.fTarget="전체"; renderAll(); }},[x])); });
  b.style.display = branches().length? "flex":"none";

  var t=document.getElementById("fTarget"); t.innerHTML="";
  t.appendChild(el("span",{class:"lbl"},["이름"]));
  var ts=["전체"].concat(targets());
  ts.forEach(function(x){ t.appendChild(el("button",{class:"chip"+(state.fTarget===x?" on":""),
    onclick:function(){ state.fTarget=x; renderAll(); }},[x])); });
  t.style.display = targets().length? "flex":"none";
}

function renderGrid(){
  var host=document.getElementById("host"); host.innerHTML="";
  var vis=visible();
  if(!state.items.length){ host.appendChild(el("div",{class:"empty"},
    ["아직 수업이 없어요.\n아래 ‘➕ 수업 추가’를 눌러 시작하세요."])); return; }
  var rg=range(); var startM=rg.s, endM=rg.e;
  var rows=(endM-startM)/30;
  var RH=Math.max(22, Math.min(34, 620/rows)); // 화면에 맞춰 높이
  var grid=el("div",{class:"grid"}); grid.style.setProperty("--rh",RH+"px");

  var head=el("div",{class:"ghead"});
  head.appendChild(el("div",{class:"gcorner"}));
  var cnt=countByDay(vis);
  DAYS.forEach(function(d,i){
    head.appendChild(el("div",{class:"dh"+(i===5?" sat":i===6?" sun":"")},
      [d, el("span",{class:"c"},[(cnt[i]||0)+""])]));
  });
  grid.appendChild(head);

  var body=el("div",{class:"gbody"});
  var tc=el("div",{class:"tcol"});
  for(var m=startM;m<endM;m+=30){
    var c=el("div",{class:"tcell"+(m%60===0?" hour":"")},[m%60===0?m2t(m):""]);
    c.style.height=RH+"px"; tc.appendChild(c);
  }
  body.appendChild(tc);

  DAYS.forEach(function(_,di){
    var col=el("div",{class:"dcol"}); col.style.height=(rows*RH)+"px";
    var list=vis.filter(function(it){ return it.days.indexOf(di)>=0; });
    var lz=lanesForDay(list);
    list.forEach(function(it,idx){
      var top=(t2m(it.start)-startM)/30*RH;
      var h=Math.max(18,(t2m(it.end)-t2m(it.start))/30*RH);
      var L=lz.lane[idx], N=lz.n;
      var blk=el("div",{class:"blk",onclick:function(e){ e.stopPropagation(); openEdit(it.id); }});
      blk.style.top=top+"px"; blk.style.height=h+"px";
      blk.style.left=(L/N*100)+"%"; blk.style.width=(100/N)+"%";
      blk.style.background=colorOf(it);
      var label=(state.fBranch==="전체"&&it.branch? it.branch+" ":"")+(it.target||"");
      blk.appendChild(el("div",{class:"tt"},[it.start]));
      var nm=el("div",{class:"nm"},[]);
      var txt=(label?label+" ":"")+it.name;
      String(txt).split(/\/\/|\n/).forEach(function(ln,i2){
        if(i2)nm.appendChild(document.createElement("br")); nm.appendChild(document.createTextNode(ln)); });
      blk.appendChild(nm);
      if(h>44) blk.appendChild(el("div",{class:"tt"},[it.end]));
      col.appendChild(blk);
    });
    body.appendChild(col);
  });
  grid.appendChild(body);
  host.appendChild(grid);
}
function countByDay(list){ var m={}; list.forEach(function(it){ it.days.forEach(function(d){ m[d]=(m[d]||0)+1; }); }); return m; }

function renderAll(){ renderFilters(); renderGrid(); markDirty(); }

/* ============ 추가 / 수정 ============ */
function openEdit(id){
  var it=id?state.items.find(function(x){return x.id===id;}):null;
  var cur={ branch:it?it.branch:(state.fBranch!=="전체"?state.fBranch:""),
    target:it?it.target:(state.fTarget!=="전체"?state.fTarget:""),
    name:it?it.name:"", days:it?it.days.slice():[], start:it?it.start:"09:00",
    end:it?it.end:"10:00", color:it?(it.color||""):"" };
  var sh=document.getElementById("sheet"); sh.innerHTML="";
  sh.appendChild(el("h2",{},[it?"수업 수정":"수업 추가"]));

  var bIn=el("input",{type:"text",value:cur.branch,placeholder:"예: 대치점 (없으면 비워도 됨)",list:"blist"});
  var bl=el("datalist",{id:"blist"}); branches().forEach(function(x){bl.appendChild(el("option",{value:x}));});
  sh.appendChild(fld("지점",[bIn,bl]));

  var tIn=el("input",{type:"text",value:cur.target,placeholder:"예: 쿠니",list:"tlist"});
  var tl=el("datalist",{id:"tlist"}); targets().forEach(function(x){tl.appendChild(el("option",{value:x}));});
  sh.appendChild(fld("이름",[tIn,tl]));

  var nIn=el("input",{type:"text",value:cur.name,placeholder:"예: 물리 브릿지"});
  sh.appendChild(fld("과목/내용",[nIn]));

  var dsel={}; cur.days.forEach(function(d){dsel[d]=1;});
  var dbox=el("div",{class:"days"});
  DAYS.forEach(function(d,i){
    dbox.appendChild(el("button",{class:(dsel[i]?"on ":"")+(i===5?"sat":i===6?"sun":""),
      onclick:function(){ dsel[i]=!dsel[i]; this.className=(dsel[i]?"on ":"")+(i===5?"sat":i===6?"sun":""); }},[d])); });
  sh.appendChild(fld("요일 (여러 개 눌러도 됨)",[dbox]));

  var sIn=el("input",{type:"time",value:cur.start});
  var eIn=el("input",{type:"time",value:cur.end});
  sh.appendChild(el("div",{class:"fld"},[el("label",{},["시간"]),
    el("div",{class:"two"},[sIn,eIn])]));

  var acts=el("div",{class:"acts"});
  if(it) acts.appendChild(el("button",{class:"del",onclick:function(){
    if(confirm("이 수업을 지울까요?")){ state.items=state.items.filter(function(x){return x.id!==id;});
      closeSheet(); renderAll(); } }},["삭제"]));
  acts.appendChild(el("button",{class:"cancel",onclick:closeSheet},["취소"]));
  acts.appendChild(el("button",{class:"save",onclick:function(){
    var days=Object.keys(dsel).filter(function(k){return dsel[k];}).map(Number);
    if(!days.length){ alert("요일을 하나 이상 골라주세요"); return; }
    if(t2m(eIn.value)<=t2m(sIn.value)){ alert("끝 시간이 시작보다 늦어야 해요"); return; }
    var data={ branch:bIn.value.trim(), target:tIn.value.trim(), name:nIn.value.trim(),
      days:days, start:sIn.value, end:eIn.value, color:cur.color };
    if(it){ Object.assign(it,data); }
    else { data.id=uid(); state.items.push(data); }
    closeSheet(); renderAll();
  }},[it?"저장":"추가"]));
  sh.appendChild(acts);

  document.getElementById("ov").classList.add("show");
}
function fld(label,kids){ return el("div",{class:"fld"},[el("label",{},[label])].concat(kids)); }
function closeSheet(){ document.getElementById("ov").classList.remove("show"); }

/* ============ 설정 ============ */
function openSettings(){
  var sh=document.getElementById("sheet"); sh.innerHTML="";
  sh.appendChild(el("h2",{},["설정"]));

  var sIn=el("input",{type:"time",value:m2t(state.cfg.start*60)});
  var eIn=el("input",{type:"time",value:m2t(state.cfg.end*60)});
  sh.appendChild(el("div",{class:"fld"},[el("label",{},["시간 범위 (수업 없을 때 기본)"]),
    el("div",{class:"two"},[sIn,eIn])]));
  sIn.addEventListener("change",function(){ state.cfg.start=Math.floor(t2m(sIn.value)/60); renderGrid(); markDirty(); });
  eIn.addEventListener("change",function(){ state.cfg.end=Math.ceil(t2m(eIn.value)/60); renderGrid(); markDirty(); });

  sh.appendChild(el("div",{class:"fld"},[el("label",{},["색 기준"]),
    el("div",{class:"row2"},["대상","지점","항목"].map(function(x){
      return el("button",{class:state.cfg.colorBy===x?"":"",style:state.cfg.colorBy===x?"background:var(--accent);color:#fff;border-color:var(--accent)":"",
        onclick:function(){ state.cfg.colorBy=x; state.colorMap={}; openSettings(); renderGrid(); markDirty(); }},[
          x==="대상"?"이름별":x==="지점"?"지점별":"과목별"]); }))]));

  sh.appendChild(el("div",{class:"row2"},[
    el("button",{onclick:function(){ openBackup(); }},["백업 · 복원"]),
    el("button",{class:"danger",onclick:function(){
      if(confirm("모든 수업을 지울까요? (되돌릴 수 없어요)")){ state.items=[]; state.colorMap={};
        state.fBranch="전체"; state.fTarget="전체"; closeSheet(); renderAll(); } }},["전체 지우기"])
  ]));
  sh.appendChild(el("div",{class:"acts"},[el("button",{class:"save",onclick:closeSheet},["닫기"])]));
  document.getElementById("ov").classList.add("show");
}

function openBackup(){
  var sh=document.getElementById("sheet"); sh.innerHTML="";
  sh.appendChild(el("h2",{},["백업 · 복원"]));
  sh.appendChild(el("div",{class:"hint"},["아래 글을 복사해두면 백업이에요. 붙여넣고 ‘복원’을 누르면 되살아나요."]));
  var ta=el("textarea",{}); ta.value=JSON.stringify(dump());
  sh.appendChild(ta);
  sh.appendChild(el("div",{class:"row2"},[
    el("button",{onclick:function(){ navigator.clipboard&&navigator.clipboard.writeText(ta.value); flash("복사됨"); }},["📋 복사"]),
    el("button",{onclick:function(){ try{ applyDump(JSON.parse(ta.value)); closeSheet(); renderAll(); saveNow(); flash("복원 완료"); }catch(e){ alert("복원 실패: "+e.message); } }},["복원"]),
    el("button",{onclick:openSettings},["← 뒤로"])
  ]));
  document.getElementById("ov").classList.add("show");
}

/* ============ 이미지 저장 ============ */
function exportPNG(){
  var vis=visible(); if(!vis.length){ flash("그릴 수업이 없어요"); return; }
  var rg=range(), startM=rg.s, endM=rg.e, rows=(endM-startM)/30;
  var RH=30, GUT=48, HH=40, colW=120, scale=2;
  var W=GUT+7*colW, H=HH+rows*RH;
  var cv=document.createElement("canvas"); cv.width=W*scale; cv.height=H*scale;
  var g=cv.getContext("2d"); g.scale(scale,scale);
  g.fillStyle="#fff"; g.fillRect(0,0,W,H);
  g.fillStyle="#f8f8fc"; g.fillRect(0,0,W,HH);
  g.fillStyle="#f5f5f9"; g.fillRect(0,0,GUT,H);
  for(var r=0;r<=rows;r++){ var y=HH+r*RH; g.strokeStyle=(r%2===0)?"#cfcfda":"#e9e9f0";
    g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }
  g.fillStyle="#666"; g.font="11px sans-serif"; g.textAlign="right"; g.textBaseline="top";
  for(var m=startM;m<endM;m+=30){ if(m%60===0){ g.fillText(m2t(m),GUT-5,HH+(m-startM)/30*RH+2); } }
  var cnt=countByDay(vis);
  DAYS.forEach(function(d,i){ var x=GUT+i*colW;
    g.strokeStyle="#ededf3"; g.beginPath(); g.moveTo(x,0); g.lineTo(x,H); g.stroke();
    g.textAlign="center"; g.textBaseline="middle";
    g.fillStyle=i===5?"#5aa9ff":i===6?"#ff6b6b":"#222"; g.font="bold 15px sans-serif";
    g.fillText(d,x+colW/2,HH/2-5);
    g.fillStyle="#999"; g.font="11px sans-serif"; g.fillText((cnt[i]||0)+"",x+colW/2,HH/2+11); });
  DAYS.forEach(function(_,di){
    var list=vis.filter(function(it){return it.days.indexOf(di)>=0;});
    var lz=lanesForDay(list);
    list.forEach(function(it,idx){
      var L=lz.lane[idx],N=lz.n, bw=colW/N;
      var x=GUT+di*colW+L*bw+2, w=bw-4;
      var y=HH+(t2m(it.start)-startM)/30*RH, h=Math.max(18,(t2m(it.end)-t2m(it.start))/30*RH);
      rr(g,x,y,w,h,6); g.fillStyle=colorOf(it); g.fill();
      g.fillStyle="#fff"; g.textAlign="center";
      g.font="bold 10px sans-serif"; g.textBaseline="top"; g.fillText(it.start,x+w/2,y+2);
      g.textBaseline="middle"; g.font="bold 11px sans-serif";
      var label=(state.fBranch==="전체"&&it.branch?it.branch+" ":"")+(it.target||"");
      var lines=((label?label+" ":"")+it.name).split(/\/\/|\n/);
      var cy=y+h/2-((lines.length-1)*11)/2;
      lines.forEach(function(ln,li){ g.fillText(clip(g,ln,w-4),x+w/2,cy+li*11); });
    });
  });
  var url=cv.toDataURL("image/png");
  var sh=document.getElementById("sheet"); sh.innerHTML="";
  sh.appendChild(el("h2",{},["이미지 저장"]));
  sh.appendChild(el("div",{class:"hint"},["휴대폰은 아래 그림을 꾹 눌러 저장 → 카톡으로 보내세요."]));
  sh.appendChild(el("img",{src:url,style:"width:100%;border-radius:10px;margin-top:8px"}));
  try{ var a=document.createElement("a"); a.href=url; a.download="시간표.png"; a.click(); }catch(e){}
  sh.appendChild(el("div",{class:"acts",style:"margin-top:12px"},[el("button",{class:"save",onclick:closeSheet},["닫기"])]));
  document.getElementById("ov").classList.add("show");
}
function rr(g,x,y,w,h,r){ r=Math.min(r,w/2,h/2); g.beginPath(); g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function clip(g,t,mx){ if(g.measureText(t).width<=mx)return t;
  while(t.length>1&&g.measureText(t+"…").width>mx)t=t.slice(0,-1); return t+"…"; }

/* ============ 저장/불러오기 (구글시트) ============ */
var SRV=(typeof google!=="undefined"&&google.script&&google.script.run);
var _auto=false,_t=null,_saving=false,_again=false,_msg={txt:SRV?"":"",color:"#9aa1b2"};
function dump(){ return {v:3, items:state.items, colorMap:state.colorMap, cfg:state.cfg}; }
function applyDump(d){
  if(d && d.items){ state.items=d.items; }
  else if(d && d.weeks && d.weeks.length){ // 옛 버전 데이터 이사
    var w=d.weeks[0]; state.items=(w.items||[]).map(function(o){
      return {id:uid(),branch:"",target:o.target||"",name:o.item||"",days:[o.day],start:o.start,end:o.end,color:""}; });
  } else state.items=[];
  // days 필드 보정(옛 단일 day)
  state.items.forEach(function(it){ if(!it.id)it.id=uid();
    if(!it.days){ it.days = (it.day!=null?[it.day]:[]); }
    if(!it.branch)it.branch=it.branch||""; if(!it.name&&it.item)it.name=it.item; });
  state.colorMap=(d&&d.colorMap)||{};
  if(d&&d.cfg)state.cfg=Object.assign(state.cfg,d.cfg);
}
function setSave(txt,color){ _msg={txt:txt,color:color||"#9aa1b2"};
  var b=document.getElementById("saveState"); if(b){ b.textContent=txt; b.style.color=_msg.color; } }
function markDirty(){ if(!_auto||!SRV)return; setSave("● 변경됨","#ffb020");
  if(_t)clearTimeout(_t); _t=setTimeout(saveNow,700); }
function saveNow(){ if(!SRV)return; if(_saving){_again=true;return;}
  _saving=true; setSave("저장 중…","#5aa9ff");
  try{ google.script.run.withSuccessHandler(function(){ _saving=false; setSave("✔ 저장됨","#7bbf3a");
      if(_again){_again=false;saveNow();} })
    .withFailureHandler(function(e){ _saving=false; setSave("✖ 저장 실패","#ff6b6b");
      showErr("저장 실패: "+(e&&e.message?e.message:e)); })
    .saveData(JSON.stringify(dump())); }
  catch(e){ _saving=false; setSave("✖ 저장 실패","#ff6b6b"); } }
function bootstrap(){
  if(SRV){ setSave("불러오는 중…","#5aa9ff");
    google.script.run.withSuccessHandler(function(json){
      try{ if(json&&json.trim())applyDump(JSON.parse(json)); }catch(e){ showErr("데이터 손상, 새로 시작: "+e.message); }
      renderAll(); _auto=true; setSave(json&&json.trim()?"✔ 불러옴":"✔ 저장됨","#7bbf3a");
      if(!(json&&json.trim()))saveNow();
    }).withFailureHandler(function(e){ renderAll(); _auto=false;
      showErr("불러오기 실패(임시 사용): "+(e&&e.message?e.message:e)); }).loadData();
  } else { renderAll(); _auto=false; }
}

/* ============ 기타 ============ */
var _ft=null;
function flash(m){ setSave(m,"#7bbf3a"); if(_ft)clearTimeout(_ft);
  _ft=setTimeout(function(){ setSave(_auto?"✔ 저장됨":"",_auto?"#7bbf3a":"#9aa1b2"); },1800); }
function showErr(m){ var e=document.getElementById("err"); e.style.display="block"; e.textContent="⚠ "+m; }

document.getElementById("addBtn").addEventListener("click",function(){ openEdit(null); });
document.getElementById("imgBtn").addEventListener("click",exportPNG);
document.getElementById("setBtn").addEventListener("click",openSettings);
document.getElementById("ov").addEventListener("click",function(e){ if(e.target===this)closeSheet(); });

bootstrap();
window.__state=state;

}catch(err){
  var e=document.getElementById("err"); e.style.display="block";
  e.textContent="오류: "+(err&&err.message?err.message:err)+"\n"+(err&&err.stack?err.stack:"");
}
})();
</script>
