document.addEventListener("click", async e => {
  const b = e.target.closest("button, tr.click"); if (!b) return;
  if (b.id==="prev"){ S.ym = S.mode==="month" ? addMonths(S.ym,-1) : addMonths(S.ym,-12); render(); return; }
  if (b.id==="next"){ S.ym = S.mode==="month" ? addMonths(S.ym,1) : addMonths(S.ym,12); render(); return; }
  if (b.id==="modeM"){ S.mode="month"; render(); return; }
  if (b.id==="modeY"){ S.mode="year"; render(); return; }
  if (b.id==="fab"){ openForm("income"); return; }
  if (b.dataset.b){ S.branch = b.dataset.b; render(); return; }
  if (b.dataset.tab){ S.tab = b.dataset.tab; render(); return; }
  if (b.dataset.type){ readForm(); const keep = {date:F.v.date, month:F.v.month||monthOf(F.v.date), branch:F.v.branch}; F.kind = b.dataset.type; F.v = keep;
    if (F.kind==="hq") F.v.branch = C().branches.find(x=>x.type==="지사")?.name; drawForm(); return; }
  if (b.hasAttribute("data-close") || b.id==="ov"){ closeForm(); return; }
  if (b.hasAttribute("data-save")){ b.disabled = true; await submitForm(); b.disabled = false; return; }
  if (b.hasAttribute("data-newteacher")){ openForm("teacher"); return; }
  if (b.hasAttribute("data-newloan")){ openForm("loan"); return; }
  if (b.dataset.rrn){ b.textContent = b.dataset.rrn; return; }
  if (b.dataset.edit){
    const [col,id] = b.dataset.edit.split(":"); const rec = S[col==="entries"?"entries":col].find(x=>x.id===id); if(!rec) return;
    const back = S.detailT; S.detailT = null;
    const kind = col==="entries" ? rec.kind : col==="teachers" ? "teacher" : col==="loans" ? "loan" : col; openForm(kind, rec); if (back) F.back = back; return; }
  if (b.dataset.del){
    if (!b.classList.contains("danger")){ b.classList.add("danger"); b.textContent="정말 삭제"; setTimeout(()=>{ if(b.isConnected){ b.classList.remove("danger"); b.textContent="삭제"; } }, 4000); return; }
    const [col,id] = b.dataset.del.split(":"); await del(col, id); return; }
  if (b.dataset.rm){
    const [key, ...rest] = b.dataset.rm.split(":"); const i = Number(rest.pop()); const sub = rest[0]; const c = C();
    if (key==="incomeItems"){ const arr = c.incomeItems[sub].filter((_,j)=>j!==i); await saveConfig({incomeItems:{...c.incomeItems, [sub]:arr}}); }
    else { await saveConfig({[key]: c[key].filter((_,j)=>j!==i)}); }
    return; }
  if (b.dataset.add !== undefined){
    const [key, sub] = b.dataset.add.split(":"); const box = $(`#add-${key}${sub?"-"+sub:""}`); const name = box.value.trim(); if(!name) return; const c = C();
    if (key==="incomeItems"){ if(!c.incomeItems[sub].includes(name)) await saveConfig({incomeItems:{...c.incomeItems, [sub]:[...c.incomeItems[sub], name]}}); }
    else if (!c[key].includes(name)) await saveConfig({[key]:[...c[key], name]});
    return; }
  if (b.hasAttribute("data-addbranch")){
    const name = $("#add-branch").value.trim(); if(!name) return; const type = $("#add-branch-type").value;
    if (!C().branches.some(x=>x.name===name)) await saveConfig({branches:[...C().branches, {name, type}]}); return; }
  if (b.hasAttribute("data-savesb")){ await saveConfig({startBalance: N($("#sb").value)}); toast("시작 잔액을 저장했습니다."); return; }
  if (b.hasAttribute("data-export")){ exportXlsx(); return; }
  if (b.dataset.ttsel){ S.ttSel = b.dataset.ttsel; render(); return; }
  if (b.dataset.ttview){ S.ttView = b.dataset.ttview; render(); return; }
  if (b.dataset.ttdow){ S.ttDow = Number(b.dataset.ttdow); render(); return; }
  if (b.hasAttribute("data-ttnew")){ schedForm(null); return; }
  if (b.hasAttribute("data-ttedit")){ schedForm(S.schedules.find(x=>x.id===S.ttSel)); return; }
  if (b.hasAttribute("data-ttcopy")){ b.disabled = true; await schedCopy(); return; }
  if (b.hasAttribute("data-gott")){ S.tab = "tt"; S.mode = "month"; render(); window.scrollTo({top:0}); return; }
  if (b.dataset.preset){ const [a,z] = b.dataset.preset.split("|"); kSet("sc-start", a); kSet("sc-end", z); return; }
  if (b.dataset.ttadd){
    const sch = S.schedules.find(x=>x.id===S.ttSel); if (!sch) return;
    const [key, time] = b.dataset.ttadd.split("|"); const [dw, br] = key.split("@");
    const endM = Math.min(toMin(time)+240, toMin(sch.end));
    slotForm(sch, { dow:Number(dw), branch:br||"", start:time, end:hm(endM) }); return; }
  if (b.dataset.slot){ const sch = S.schedules.find(x=>x.id===S.ttSel); const sl = (sch?.slots||[]).find(x=>x.id===b.dataset.slot); if (sl) slotForm(sch, { ...sl }); return; }
  if (b.hasAttribute("data-slsave")){ b.disabled = true; await slotSave(); if (b.isConnected) b.disabled = false; return; }
  if (b.hasAttribute("data-sldel")){ await slotDel(); return; }
  if (b.hasAttribute("data-scsave")){ b.disabled = true; await schedSave(); if (b.isConnected) b.disabled = false; return; }
  if (b.hasAttribute("data-scdel")){
    if (!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent = "정말 삭제 (근무 전부 지워짐)"; return; }
    await del("schedules", F.id); S.ttSel = null; closeForm(); return; }
  if (b.dataset.tdetail){ openDetail(b.dataset.tdetail); return; }
  if (b.hasAttribute("data-closedetail") || b.id==="ovd"){ closeDetail(); return; }
  if (b.hasAttribute("data-addpay") || b.hasAttribute("data-addbonus")){
    const t = S.teachers.find(x=>x.id===S.detailT); const back = S.detailT; S.detailT = null;
    openForm(b.hasAttribute("data-addbonus") ? "bonus" : "payroll", { month:S.ym, teacher:t.name, branch:tBr(t)[0]||"" }); F.id = null; F.back = back; return; }
  if (b.hasAttribute("data-gopay")){ S.payT = S.detailT; closeDetail(); S.tab = "pay"; S.mode = "month"; render(); return; }
  if (b.dataset.day){ S.payDay = Number(b.dataset.day); render(); return; }
  if (["data-saveday","data-clearday","data-fillsched","data-fillsched2","data-savemonth","data-savecontract","data-confirmpay"].some(a=>b.hasAttribute(a))){ b.disabled = true; await payAction(b); if (b.isConnected) b.disabled = false; return; }
  if (b.hasAttribute("data-saverates")){ const r = {}; for (const k of Object.keys(RATES_DEFAULT)) r[k] = Number($("#rt-"+k).value)||RATES_DEFAULT[k]; await saveConfig({rates:r}); toast("요율을 저장했습니다."); return; }
  if (b.hasAttribute("data-template")){ impTemplate(); return; }
  if (b.hasAttribute("data-airead")){ aiRead(); return; }
  if (b.hasAttribute("data-aiclassify")){ aiClassify(); return; }
  if (b.hasAttribute("data-stclear")){ S.stage = []; render(); return; }
  if (b.hasAttribute("data-import")){ b.disabled = true; await doImport(); return; }
  if (b.matches("tr.click")){ S.branch = b.dataset.b; render(); window.scrollTo({top:0}); return; }
});
document.addEventListener("mousedown", e => { if (e.target.id==="ov") closeForm(); if (e.target.id==="ovd") closeDetail(); });
document.addEventListener("change", e => {
  const t = e.target;
  if (t.matches?.(".kpick select")){ kSync(t.closest(".kpick")); return; }
  if (t.type==="file" && t.closest(".kfile")){ const n = t.files?.length||0; t.closest(".kfile").querySelector(".kfn").textContent = n ? (n===1 ? t.files[0].name : `${n}개 파일`) : "선택한 파일 없음"; }
}, true);
document.addEventListener("click", e => { const b = e.target.closest("[data-kclear]"); if (!b) return; const box = b.closest(".kpick"); box.querySelectorAll("select").forEach(x=>x.value=""); kSync(box); });
document.addEventListener("change", e => {
  const el = e.target, id = el.id;
  if (id==="payT"){ S.payT = el.value; S.payDay = null; render(); return; }
  if (id==="dy-s2on"){ $("#dy-s2box").hidden = !el.checked; return; }
  if (id==="imp-file" && el.files?.[0]){ impFile(el.files[0]); return; }
  if (!S.imp && !el.dataset.st && !el.hasAttribute("data-stall")) return;
  if (id==="imp-sheet"){ S.imp.sheet = el.value; impSheet(); return; }
  if (id==="imp-header"){ S.imp.header = Math.max(0, Number(el.value)-1); S.imp.map = impGuess(S.imp.rows[S.imp.header]||[]); impBuild(); return; }
  if (el.dataset.map){ if (el.value==="") delete S.imp.map[el.dataset.map]; else S.imp.map[el.dataset.map] = Number(el.value); impBuild(); return; }
  if (id==="imp-mode"){ S.imp.mode = el.value; impBuild(); return; }
  if (id==="imp-br"){ S.imp.defBranch = el.value; impBuild(); return; }
  if (id==="imp-inc"){ S.imp.defInc = el.value; impBuild(); return; }
  if (id==="imp-exp"){ S.imp.defExp = el.value; impBuild(); return; }
  if (el.hasAttribute("data-stall")){ S.stage.forEach(x => x.sel = el.checked); render(); return; }
  if (el.dataset.st){
    const x = S.stage[Number(el.dataset.st)], f = el.dataset.f; if (!x) return;
    if (f==="sel") x.sel = el.checked; else if (f==="amount") x.amount = N(el.value); else x[f] = el.value;
    if (f==="kind" || f==="branch"){ const c = C(); const list = x.kind==="income" ? c.incomeItems[branchType(x.branch)==="지사"?"지사":"지점"] : [...c.expenseOp, ...c.expenseNonOp]; if (!list.includes(x.item)) x.item = list[0]; }
    if (["sel","kind","branch"].includes(f)) render();
  }
});
document.addEventListener("keydown", e => { if (e.key!=="Escape") return; if (F) closeForm(); else if (S.detailT) closeDetail(); });
document.addEventListener("input", e => {
  if (e.target.classList?.contains("money") && !e.target.closest("#frm")){ const raw=e.target.value.replace(/[^\d-]/g,""); e.target.value = raw?Number(raw).toLocaleString("ko-KR"):""; }
  if (e.target.id==="q"){ S.q = e.target.value; render._focusQ = true; render(); render._focusQ = false; } });

try { document.documentElement.lang = "ko"; } catch {}
boot();
})();
</script>
